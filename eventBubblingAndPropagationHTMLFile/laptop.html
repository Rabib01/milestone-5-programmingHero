<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laptop Page</title>
    <style>
      .laptop-container h1 {
        font-family: "Poppins", sans-serif;
        font-size: clamp(3rem, 8vw, 6rem);
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 8px;
        text-align: center;

        /* Gradient text */
        background: linear-gradient(
          90deg,
          #00f5ff,
          #00ff88,
          #ffee00,
          #ff7300,
          #ff008c,
          #8a2be2,
          #00f5ff
        );
        background-size: 400%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;

        /* Glow */
        text-shadow:
          0 0 10px rgba(0, 255, 255, 0.8),
          0 0 20px rgba(255, 0, 200, 0.6),
          0 0 40px rgba(0, 255, 255, 0.5),
          0 0 70px rgba(255, 0, 200, 0.4);

        /* Spacing */
        margin: 50px 0;
        padding: 25px 40px;

        /* Fancy border */
        border: 4px solid transparent;
        border-image: linear-gradient(
            135deg,
            #00f5ff,
            #ff00aa,
            #ffee00,
            #00f5ff
          )
          1;

        border-radius: 20px;

        /* Background behind the text */
        background-color: rgba(15, 15, 15, 0.85);

        /* Shadow */
        box-shadow:
          0 0 20px rgba(0, 255, 255, 0.4),
          0 0 50px rgba(255, 0, 170, 0.3),
          inset 0 0 20px rgba(255, 255, 255, 0.08);

        /* Animation */
        animation:
          rainbowFlow 6s linear infinite,
          floatTitle 3s ease-in-out infinite;

        cursor: default;
        transition:
          transform 0.3s ease,
          letter-spacing 0.3s ease;
      }

      .laptop-container h1:hover {
        transform: scale(1.08) rotate(-1deg);
        letter-spacing: 14px;
      }

      @keyframes rainbowFlow {
        from {
          background-position: 0%;
        }
        to {
          background-position: 400%;
        }
      }

      @keyframes floatTitle {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-12px);
        }
      }
    </style>
  </head>
  <body>
    <div class="laptop-container">
      <h1>This is a laptop page</h1>
    </div>
    <script src="main.js"></script>
  </body>
</html>
